    "fastapi>=0.100.0",
    "beautifulsoup4>=4.12.0",
    "flashrank>=0.2.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "langchain>=1.3.1",
    "langchain-classic>=1.0.7",
    "langchain-community>=0.4.1",
    "langchain-groq",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=0.0.1",
    "protobuf<=3.20.3",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
    "twilio>=9.0.0",
    "uvicorn>=0.25.0",
    "cloudscraper>=1.2.71",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.18.0",
    "fastembed>=0.3.0",
    "pymupdf>=1.24.0",
